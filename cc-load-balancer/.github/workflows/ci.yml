name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  docker-smoke:
    name: Docker + load balancing smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the load balancer
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Check requests reach at least 2 different instances
        run: |
          for i in $(seq 1 12); do
            curl -s http://localhost:8080/api/whoami | jq -r .instance
          done | sort -u | tee instances.txt
          test "$(wc -l < instances.txt)" -ge 2
      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to EC2 (optional)
    needs: docker-smoke
    runs-on: ubuntu-latest
    # Runs only on main pushes AND only if you set repo variable ENABLE_EC2_DEPLOY=true
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_EC2_DEPLOY == 'true'
    steps:
      - name: SSH into EC2 and redeploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/key "$EC2_USER@$EC2_HOST" \
            "cd ~/cc-load-balancer && git pull && docker compose up -d --build"
