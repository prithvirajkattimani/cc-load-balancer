x-app: &app
  build: .
  restart: unless-stopped
  depends_on:
    - redis

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  app1:
    <<: *app
    environment:
      INSTANCE_NAME: app-1
      REDIS_URL: redis://redis:6379/0

  app2:
    <<: *app
    environment:
      INSTANCE_NAME: app-2
      REDIS_URL: redis://redis:6379/0

  app3:
    <<: *app
    environment:
      INSTANCE_NAME: app-3
      REDIS_URL: redis://redis:6379/0

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
