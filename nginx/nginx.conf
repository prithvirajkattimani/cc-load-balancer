worker_processes 1;

events {}

http {
    # Round-robin is the default balancing method
    upstream backend {
        zone backend 64k;   # shared state so the counter is not per-worker
        server app1:5000 max_fails=2 fail_timeout=10s;
        server app2:5000 max_fails=2 fail_timeout=10s;
        server app3:5000 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header X-Upstream $upstream_addr always;
        }
    }
}